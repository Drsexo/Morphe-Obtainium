<style>
:root {
    --bg: #0e0f13;
    --card: #15171d;
    --text: #f2f3f7;
    --muted: #9aa0ab;
    --line: rgba(255, 255, 255, 0.07);
    --line-strong: rgba(255, 255, 255, 0.18);
    --accent: #8b5cf6;
    --accent-deep: #6d28d9;
    --note-bg: rgba(250, 204, 21, 0.06);
    --note-line: rgba(250, 204, 21, 0.22);
    --note-icon: #facc15;
}

[data-theme="light"] {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #101318;
    --muted: #5b6472;
    --line: rgba(16, 24, 40, 0.09);
    --line-strong: rgba(16, 24, 40, 0.22);
    --note-bg: rgba(180, 130, 10, 0.07);
    --note-line: rgba(180, 130, 10, 0.25);
    --note-icon: #b45309;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 64px;
}

.header {
    text-align: center;
    margin-bottom: 26px;
    position: relative;
}

.theme-toggle {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    transition: border-color 0.18s ease, transform 0.18s ease;
}

.theme-toggle:hover {
    border-color: var(--accent);
    transform: scale(1.05);
}

.theme-toggle svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}

.title {
    font-size: clamp(2rem, 6vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    background: linear-gradient(120deg, var(--text) 30%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 8px;
}

.subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 22px;
}

.github-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: 11px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: border-color 0.18s ease, transform 0.18s ease;
}

.github-btn:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
}

.github-btn svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
}

.note {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--note-bg);
    border: 1px solid var(--note-line);
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 22px;
}

.note svg {
    width: 18px;
    height: 18px;
    fill: var(--note-icon);
    flex-shrink: 0;
    margin-top: 2px;
}

.note a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
}

.note a:hover {
    text-decoration: underline;
}

.grid {
    display: grid;
    gap: 10px;
    margin-bottom: 28px;
}

.card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 16px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--line);
    text-decoration: none;
    transition: border-color 0.18s ease, transform 0.18s ease;
}

.card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--brand-gradient);
    opacity: 0;
    transition: opacity 0.18s ease;
}

.card:hover,
.card:focus-visible {
    transform: translateY(-1px);
    border-color: var(--line-strong);
}

.card:hover::before,
.card:focus-visible::before {
    opacity: 1;
}

.tile {
    width: 50px;
    height: 50px;
    border-radius: 14px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: var(--brand-gradient);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 2px 8px rgba(0, 0, 0, 0.22);
    transition: transform 0.18s ease;
}

.card:hover .tile {
    transform: scale(1.06);
}

.tile svg {
    width: 25px;
    height: 25px;
    fill: #fff;
}

.meta {
    flex: 1;
    min-width: 0;
}

.line {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.name {
    font-size: 1.02rem;
    font-weight: 700;
    color: var(--text);
}

.chip {
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
}

.desc {
    font-size: 0.84rem;
    color: var(--muted);
    margin-top: 1px;
}

.go {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    transition: background 0.18s ease, border-color 0.18s ease;
}

.go svg {
    width: 14px;
    height: 14px;
    fill: var(--muted);
    transition: fill 0.18s ease, transform 0.18s ease;
}

.card:hover .go {
    background: var(--brand-color);
    border-color: transparent;
}

.card:hover .go svg {
    fill: #fff;
    transform: translateX(1px);
}

.footer {
    text-align: center;
    padding: 26px 20px;
    border-radius: 16px;
    background: var(--card);
    border: 1px solid var(--line);
}

.footer h2 {
    font-size: 1.08rem;
    font-weight: 700;
    margin-bottom: 4px;
}

.footer p {
    color: var(--muted);
    font-size: 0.86rem;
    margin-bottom: 16px;
}

.btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 12px 24px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    box-shadow: 0 4px 16px rgba(124, 58, 237, 0.32);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(124, 58, 237, 0.42);
}

.btn-primary svg {
    width: 18px;
    height: 18px;
    fill: #fff;
}

a:focus-visible,
button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.app-youtube {
    --brand-color: #ff0000;
    --brand-gradient: linear-gradient(135deg, #ff4141, #c40000);
}

.app-ytmusic {
    --brand-color: #ff0000;
    --brand-gradient: linear-gradient(135deg, #ff4141, #c40000);
}

.app-reddit {
    --brand-color: #ff4500;
    --brand-gradient: linear-gradient(135deg, #ff6a3d, #e03300);
}

.app-x {
    --brand-color: #000000;
    --brand-gradient: linear-gradient(135deg, #333333, #000000);
}

.app-instagram {
    --brand-color: #e4405f;
    --brand-gradient: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
}

.app-messenger {
    --brand-color: #00b2ff;
    --brand-gradient: linear-gradient(135deg, #00c6ff, #7a3bff);
}

.app-facebook {
    --brand-color: #1877f2;
    --brand-gradient: linear-gradient(135deg, #2a7fff, #0c54b8);
}

.app-gphotos {
    --brand-color: #f4b400;
    --brand-gradient: linear-gradient(135deg, #f6be00, #db4437);
}

.app-microg {
    --brand-color: #4285f4;
    --brand-gradient: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
}

@media (max-width: 480px) {
    .wrap {
        padding: 36px 16px 48px;
    }

    .tile {
        width: 46px;
        height: 46px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition: none !important;
        animation: none !important;
    }
}
</style>

        function generateObtainiumUrl(appConfig) {
            const additionalSettingsStr = JSON.stringify(appConfig.additionalSettings);
            const fullConfig = {
                id: appConfig.id,
                url: appConfig.url,
                author: appConfig.author,
                name: appConfig.name,
                preferredApkIndex: appConfig.preferredApkIndex,
                additionalSettings: additionalSettingsStr
            };
            const jsonStr = JSON.stringify(fullConfig);
            let encoded = '';
            for (let i = 0; i < jsonStr.length; i++) {
                const char = jsonStr[i];
                const code = jsonStr.charCodeAt(i);
                if ((code >= 48 && code <= 57) || (code >= 65 && code <= 90) ||
                    (code >= 97 && code <= 122) || char === '-' || char === '_' ||
                    char === '.' || char === '~') {
                    encoded += char;
                } else {
                    const bytes = new TextEncoder().encode(char);
                    for (let k = 0; k < bytes.length; k++) {
                        encoded += '%' + bytes[k].toString(16).toUpperCase().padStart(2, '0');
                    }
                }
            }
            return 'obtainium://app/' + encoded;
        }

        function generateAppCards() {
            const grid = document.getElementById('apps-grid');
            apps.forEach(app => {
                const url = generateObtainiumUrl(app.config);
                const card = document.createElement('a');
                card.href = url;
                card.className = 'card ' + app.cssClass;
                const chip = app.brand ? '<span class="chip">' + app.brand + '</span>' : '';
                card.innerHTML =
                    '<div class="tile"><svg viewBox="0 0 24 24" aria-hidden="true">' + app.iconSvg + '</svg></div>' +
                    '<div class="meta">' +
                        '<div class="line"><span class="name">' + app.name + '</span>' + chip + '</div>' +
                        '<div class="desc">' + app.desc + '</div>' +
                    '</div>' +
                    '<div class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></div>';
                grid.appendChild(card);
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');
            if (theme === 'light') {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }

        updateThemeIcon(document.documentElement.getAttribute('data-theme') || 'dark');
        generateAppCards();
    </script>
